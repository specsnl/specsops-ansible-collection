---
minor_changes:
  - >-
    postgresql - ``postgresql_data_directory`` may now sit more than one level below the
    mounted volume, such as ``/srv/pgdata/18/main``. The role creates the missing
    directories between the mount point and the data directory, owned by ``postgres``
    with mode ``0755``, instead of failing when the parent does not exist.
breaking_changes:
  - >-
    postgresql - the role now fails when ``postgresql_data_directory`` would land on the
    root filesystem, checked with ``findmnt`` on the nearest directory on its path that
    exists. This also catches a volume that failed to mount while its mount point exists
    on the OS disk, which the old parent check let through. Set the new
    ``postgresql_data_directory_require_mount`` to ``false`` to keep the data on the root
    filesystem at a custom path.
