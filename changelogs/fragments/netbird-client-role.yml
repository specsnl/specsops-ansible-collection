---
minor_changes:
  - >-
    netbird_client - new role that installs the NetBird client from ``pkgs.netbird.io`` and
    pins ``netbird`` at ``netbird_client_version`` with an apt preference, so an upgrade
    never moves the client ahead of the server. With ``netbird_client_lazy_connections``
    off (the default) a ``netbird.service`` drop-in sets ``NB_LAZY_CONN=off``, which wins
    over the account setting. With ``netbird_client_setup_key`` the service is enabled and
    ``netbird up`` runs with ``netbird_client_management_url``, ``netbird_client_hostname``
    and ``netbird_client_wireguard_port`` while the client is not yet connected. Without a
    setup key the service is stopped and disabled and ``/var/lib/netbird`` is deleted, so
    VMs built from an image do not share the WireGuard key the package's post-install
    script generates. With ``netbird_client_manage_firewall`` the WireGuard port is opened
    in ufw, tagged ``specsnl.specsops.netbird_client`` so a rule for an old port is removed.
    No rules are added for ``wt0``: the client accepts tunnel traffic above ufw and
    enforces NetBird's policies itself.
  - >-
    cleanup - ``cleanup_state_paths`` (default ``[/var/lib/netbird]``) are deleted outright,
    as a second guard against baking the NetBird client's WireGuard key into an image.

trivial:
  - >-
    CI - ``netbird_client`` is wired into the Molecule matrices of ``pr.yml`` and
    ``main.yml`` and into the Taskfile ``ROLES`` fan-out.
  - >-
    galaxy.yml - the ``database`` tag, which ``postgresql`` already covers, makes room for
    ``netbird``; Galaxy rejects more than 20 tags.
