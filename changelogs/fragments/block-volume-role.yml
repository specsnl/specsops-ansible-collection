---
minor_changes:
  - >-
    block_volume - new role that mounts UpCloud block storage volumes, so a VM rebuilt
    from an image mounts the same data again. Each entry in ``block_volume_devices``
    names a ``storage_uuid``, ``label`` and ``mount_point``. The disk is found at
    ``/dev/disk/by-id/virtio-<first 20 characters of the UUID without dashes>``, and the
    role fails when it is not attached. A filesystem (``ext4`` by default) is created
    only when the disk has none, through ``community.general.filesystem`` with
    ``force: false``, and an existing filesystem without a label gets one. The role
    refuses a partitioned disk, a filesystem of another type, another label, and a
    label that a second disk also carries. The volume is mounted as ``LABEL=<label>``
    without ``nofail``, so a missing volume stops the boot rather than letting services
    write to the OS disk. Units in ``required_by`` get a ``RequiresMountsFor`` drop-in.
    In containers only the fstab entry and the drop-ins are written.

trivial:
  - >-
    CI - ``block_volume`` is wired into the Molecule matrices of ``pr.yml`` and
    ``main.yml`` and into the Taskfile ``ROLES`` fan-out.
  - >-
    galaxy.yml - the ``logging`` tag, which ``logrotate`` already covers, makes room
    for ``storage``; Galaxy rejects more than 20 tags.
