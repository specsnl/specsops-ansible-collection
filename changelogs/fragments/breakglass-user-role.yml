---
minor_changes:
  - >-
    breakglass_user - new role that creates a console-only login for when NetBird, the
    only admin door, is down. ``breakglass_user_name`` (``breakglass``) is put in ``sudo``
    with ``breakglass_user_password_hash``, which must be a SHA-512 crypt hash, so only the
    hash reaches Ansible. Any ``authorized_keys`` are removed, and an sshd drop-in with
    ``DenyUsers`` keeps the password off SSH even if password login is ever enabled.
    ``hardening`` leaves the console's ``login`` PAM stack alone, which Molecule checks by
    authenticating through it after running ``hardening``.

trivial:
  - >-
    CI - ``breakglass_user`` is wired into the Molecule matrices of ``pr.yml`` and
    ``main.yml`` and into the Taskfile ``ROLES`` fan-out.
