---
minor_changes:
  - >-
    netbird_server - new role that runs the self-hosted NetBird control plane as Podman
    Quadlets: ``netbird-server.container`` from ``netbirdio/netbird-server`` (management,
    signal, relay and STUN with the embedded IdP) and ``netbird-dashboard.container`` from
    ``netbirdio/dashboard``, each pinned and published on ``127.0.0.1``, with STUN
    published on ``netbird_server_stun_port``. ``/etc/netbird-server/config.yaml``
    (``0600``) sets the exposed address, the embedded IdP's issuer and redirect URIs,
    ``reverseProxy.trustedHTTPProxies`` and ``trustedPeers`` from
    ``netbird_server_trusted_proxies`` (Podman's gateway, ``10.88.0.1/32``, by default),
    the SQLite store with its encryption key, and ``disableAnonymousMetrics``. The data
    directory has to be on a mounted filesystem, like ``pocket_id``. A site file under
    ``/etc/caddy/sites/`` routes gRPC over h2c and the server's paths to the server and
    the rest to the dashboard. With ``netbird_server_manage_firewall`` the STUN port gets
    an ``allow`` and a ``route allow`` rule in ufw, since the published port is forwarded
    into the container. ``netbird_server_setup_pat_enabled`` sets
    ``NB_SETUP_PAT_ENABLED=true`` for an API-driven bootstrap.

trivial:
  - >-
    CI - ``netbird_server`` is wired into the Molecule matrices of ``pr.yml`` and
    ``main.yml`` and into the Taskfile ``ROLES`` fan-out.
