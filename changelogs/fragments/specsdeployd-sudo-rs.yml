---
bugfixes:
  - >-
    specsdeployd - the sudoers drop-in now parses under sudo-rs, which is ``sudo`` and
    ``visudo`` on Ubuntu 26.04. sudo-rs accepts only a lone trailing ``*`` in sudoers
    arguments and rejected ``systemctl restart app-*.service``, so ``visudo`` failed
    the role. The restart now goes through ``/usr/libexec/specsdeployd/restart-app``,
    a root-owned wrapper the role installs. It runs ``systemctl restart`` only for a
    single unit name matching ``^app-[a-z0-9][a-z0-9-]*\.service$`` and exits ``64``
    for anything else, so specsdeployd still cannot restart units that are not apps.
