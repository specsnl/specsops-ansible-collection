---
minor_changes:
  - >-
    pocket_id - new role that runs the Pocket ID passkey OIDC provider as a Podman Quadlet,
    ``/etc/containers/systemd/pocket-id.container``, from ``ghcr.io/pocket-id/pocket-id`` at
    ``pocket_id_version``. The container is published on ``127.0.0.1:<pocket_id_port>``
    with ``APP_URL``, ``TRUST_PROXY=true`` and ``ANALYTICS_DISABLED=true``, and keeps its
    SQLite data in ``pocket_id_data_dir``. The role fails when that directory would land on
    the root filesystem, like ``postgresql``. ``pocket_id_encryption_key`` is written to a
    ``0600`` file for ``ENCRYPTION_KEY_FILE``, owned by a ``pocket-id`` system user whose
    uid and gid the container gets as ``PUID`` and ``PGID``, since the image's entrypoint
    drops from root before the key is read. A site file under ``/etc/caddy/sites/``
    proxies the app URL's host to the container.
  - >-
    caddy - the README documents that roles such as ``pocket_id`` write their sites to
    ``/etc/caddy/sites/``, which the deployed Caddyfile has to import.

trivial:
  - >-
    CI - ``pocket_id`` is wired into the Molecule matrices of ``pr.yml`` and ``main.yml``
    and into the Taskfile ``ROLES`` fan-out.
  - >-
    galaxy.yml - the ``webserver`` tag, which ``caddy`` already covers, makes room for
    ``oidc``; Galaxy rejects more than 20 tags.
