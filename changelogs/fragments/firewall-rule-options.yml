---
minor_changes:
  - >-
    firewall - rule entries in ``firewall_rules`` and ``firewall_extra_rules`` now also
    take ``direction``, ``interface``, ``interface_in``, ``interface_out``, ``from_ip``,
    ``from_port``, ``to_ip``, ``to_port``, ``route``, ``comment`` and ``delete``, so a
    rule can be limited to a source network or an interface, match routed traffic, or
    remove a rule applied earlier. Removing an entry from the list still leaves its rule
    active in ufw; closing it takes a ``delete: true`` entry. Existing ``{rule, port,
    proto}`` entries keep working, with ``port`` an alias of ``to_port``.

trivial:
  - >-
    firewall - Molecule converges one rule of each kind and verifies them with ``ufw show
    added``; a prepare step adds the rule the delete entry removes.
