---
minor_changes:
  - >-
    postgresql_apps - new role that gives each app on a local PostgreSQL server its own
    login role, a database owned by it, and a ``pg_hba.conf`` line that admits only that
    role, to only that database, from only ``allowed_cidr``. ``CONNECT`` on the database
    is revoked from ``PUBLIC``, so other apps' roles cannot connect either. The lines go in
    their own marker block, ``specsnl.specsops.postgresql_apps``, leaving the
    ``postgresql`` role's block alone, and the server is reloaded, not restarted, after
    ``pg_hba_file_rules`` is checked for errors. ``state: absent`` removes the line and
    sets ``NOLOGIN``, but never drops the database. Passwords are passed in; the role does
    no secret lookups.
  - >-
    The collection now depends on ``community.postgresql`` (``>=4.0.0,<6.0.0``), used by
    the ``postgresql_apps`` role.
