ancestor: null
releases:
  0.1.0:
    changes:
      major_changes:
      - "Initial release of the ``specsnl.specsops`` collection \u2014 eight roles
        for provisioning and hardening Specs Ubuntu 24.04 (noble) hosts."
      minor_changes:
      - 'base - baseline system setup: apt update/upgrade, core packages, locale,
        timezone and ``sysctl`` tuning. Configures ``needrestart``, ``DPkg::Lock::Timeout``
        and ``force-confdef,force-confold`` so an unattended apt upgrade cannot hang
        on a prompt or fail on a held lock. Optional ``base_prefer_ipv4`` prefers
        IPv4 in ``/etc/gai.conf``.'
      - "cleanup - build-time image cleanup \u2014 apt autoremove/clean and temp directory
        wipe."
      - "firewall - ufw baseline \u2014 default deny incoming, allow outgoing, and
        configurable rules."
      - 'hardening - OS hardening: an sshd drop-in that disables password and keyboard-interactive
        authentication, plus fail2ban. Installs ``openssh-server`` and prepares the
        host keys and ``/run/sshd`` itself, so the role is self-contained on minimal
        images.'
      - logrotate - caps rotated log size and enables compression globally in ``/etc/logrotate.conf``.
      - postgresql - PostgreSQL installation from PGDG with tuning, ``listen_addresses``,
        ``port``, timezone and ``pg_hba.conf`` entries. Only opens a ufw rule when
        the server listens beyond loopback.
      - swap - creates, formats, persists and activates a swap file, and applies the
        related sysctl tuning.
      - unattended_upgrades - automatic security updates via unattended-upgrades and
        chrony, including the periodic download, autoclean and Ubuntu ESM origins.
      release_summary: 'First release of ``specsnl.specsops``. The collection provisions
        and hardens Specs Ubuntu 24.04 (noble) hosts: base system, hardening, firewall,
        unattended upgrades, swap, log rotation, image cleanup and PostgreSQL.'
    release_date: '2026-09-09'
  0.2.0:
    changes:
      breaking_changes:
      - "The collection now targets Ubuntu 26.04 LTS (Resolute Raccoon). Support for
        Ubuntu 24.04 (Noble Numbat) is dropped \u2014 role metadata, Molecule test
        images and documentation all reference 26.04. The roles themselves derive
        the release from facts and carry no hardcoded codename."
      release_summary: Retargets the collection at Ubuntu 26.04 LTS (Resolute Raccoon).
        Ubuntu 24.04 (Noble Numbat) is no longer a supported or tested platform. The
        roles carry no hardcoded codename, so the change is confined to platform metadata,
        the Molecule test image and the documentation.
    fragments:
    - 0.2.0-release-summary.yml
    - ubuntu-2604.yml
    release_date: '2026-09-10'
  0.3.0:
    changes:
      minor_changes:
      - 'ansible_pull - new role that installs the ``ansible`` package, ``/etc/ansible-pull/env``
        and an ``ansible-pull.service`` / ``ansible-pull.timer`` pair. Both ship disabled
        and inert: an empty ``ANSIBLE_PULL_REPO`` makes the service exit 0 with a
        log line instead of running ``ansible-pull``, and the timer is only enabled
        by ``ansible_pull_enabled``. ``ansible_pull_interval`` is validated with ``systemd-analyze
        calendar``, since ``OnCalendar`` takes a calendar event and would otherwise
        park the timer forever on a timespan such as ``30min``.'
      - caddy - new role that adds the official Cloudsmith apt repository, installs
        Caddy, enables the service and optionally opens 80/443 in ufw. It does not
        depend on the ``firewall`` role, so the rules are skipped with a warning when
        ufw is missing rather than aborting the play with Caddy already listening.
        The package's default Caddyfile is left in place.
      - "podman - new role that installs Podman from the Ubuntu ``universe`` repository.
        Resolute ships 5.7.x, which already bundles the Quadlet generator, so no extra
        apt repository is needed. The role ships no unit files and enables neither
        ``podman.socket`` nor ``podman-auto-update.timer`` \u2014 Quadlet-managed
        containers are plain systemd units and need neither."
      - 'specsdeployd - new role that lays down the scaffolding for the ``specsdeployd``
        deploy webhook receiver: a system user, an empty config directory, a two-command
        sudoers drop-in written through ``visudo -cf``, and a systemd unit. The unit
        ships enabled but dormant behind ``ConditionPathExists``, so a golden image
        can carry it without collecting a failed unit on every boot. Installing the
        binary is opt-in via ``specsdeployd_version``, which fetches that release''s
        ``.deb`` and verifies it against the release ``checksums.txt``.'
      release_summary: "Adds the four app-image roles that build on the base host
        roles: ``podman``, ``caddy``, ``specsdeployd`` and ``ansible_pull``. Together
        they cover a Specs golden image that runs containerised applications behind
        Caddy, receives deploys over a webhook and reconciles itself with ansible-pull.
        All four are safe to run at image-build time \u2014 ``specsdeployd`` and ``ansible_pull``
        ship inert, with no binary and no repository configured, so the same playbook
        bakes an image and provisions a live host."
    fragments:
    - 0.3.0-release-summary.yml
    - app-image-roles.yml
    release_date: '2026-09-16'
  0.3.1:
    changes:
      bugfixes:
      - 'cleanup - entries of ``cleanup_paths`` are now left alone when they are mounts
        whose contents never reach the image: a tmpfs anywhere, or any mount when
        running in a container, since ``docker commit`` captures neither tmpfs nor
        volumes. Wiping those saved nothing, and when Ansible runs on the target itself
        (Packer''s ``ansible-local``) it deleted Python''s multiprocessing scratch
        directory from ``/tmp`` mid-run, so the build ended in a ``FileNotFoundError``
        traceback. A path on its own disk partition on a VM is still wiped. ``cleanup_skip_ephemeral:
        false`` restores the old behaviour.'
      release_summary: Bugfix release. The ``cleanup`` role no longer wipes ``cleanup_paths``
        entries whose contents never reach the image, which broke Packer ``ansible-local``
        builds by deleting Python's multiprocessing scratch directory from ``/tmp``
        mid-run.
    fragments:
    - 0.3.1-release-summary.yml
    - cleanup-skip-ephemeral-mounts.yml
    release_date: '2026-09-25'
  0.3.2:
    changes:
      minor_changes:
      - cloud_init_user - new role that bakes a cloud-init ``system_info.default_user``
        drop-in into an image, so first boot creates a non-root sudo user (``specsops``
        by default) and installs the metadata SSH keys on it rather than on ``root``,
        which ``hardening`` locks out with ``PermitRootLogin no``. Optional ``cloud_init_user_ssh_import_ids``
        installs ``ssh-import-id`` and imports keys such as ``gh:<user>`` once per
        instance; they are written as a top-level ``ssh_import_id``, because ``cc_ssh_import_id``
        ignores the key under ``default_user``. The drop-in is validated with ``cloud-init
        schema`` when cloud-init is installed.
      release_summary: Feature release. The new ``cloud_init_user`` role gives images
        a non-root cloud-init default login user, so VMs cloned from a template that
        ``hardening`` locks root out of can be logged into with the keys given at
        creation.
    fragments:
    - 0.3.2-release-summary.yml
    - cloud-init-user-role.yml
    release_date: '2026-09-27'
  0.4.0:
    changes:
      bugfixes:
      - specsdeployd - the sudoers drop-in now parses under sudo-rs, which is ``sudo``
        and ``visudo`` on Ubuntu 26.04. sudo-rs accepts only a lone trailing ``*``
        in sudoers arguments and rejected ``systemctl restart app-*.service``, so
        ``visudo`` failed the role. The restart now goes through ``/usr/libexec/specsdeployd/restart-app``,
        a root-owned wrapper the role installs. It runs ``systemctl restart`` only
        for a single unit name matching ``^app-[a-z0-9][a-z0-9-]*\.service$`` and
        exits ``64`` for anything else, so specsdeployd still cannot restart units
        that are not apps.
      minor_changes:
      - 'firewall - rule entries in ``firewall_rules`` and ``firewall_extra_rules``
        now also take ``direction``, ``interface``, ``interface_in``, ``interface_out``,
        ``from_ip``, ``from_port``, ``to_ip``, ``to_port``, ``route``, ``comment``
        and ``delete``, so a rule can be limited to a source network or an interface,
        match routed traffic, or remove a rule applied earlier. Removing an entry
        from the list still leaves its rule active in ufw; closing it takes a ``delete:
        true`` entry. Existing ``{rule, port, proto}`` entries keep working, with
        ``port`` an alias of ``to_port``.'
      - postgresql - new ``postgresql_data_directory`` option that keeps the cluster
        on a separate volume, so the VM can be rebuilt and the data reattached. An
        empty target gets the image's default cluster copied in with ``rsync -a``.
        A target that already holds a cluster of the same major version is adopted
        as-is, and the role fails on a major-version mismatch. A non-empty target
        without ``PG_VERSION`` is never deleted or overwritten; the role fails instead,
        as it does when the parent directory is missing. ``data_directory`` is set
        in ``postgresql.conf``. The default, an empty string, keeps the Debian location.
      - postgresql - new ``postgresql_firewall_sources`` limits the ufw rule for ``postgresql_port``
        to given sources. Each entry has an optional ``from_ip`` and ``interface``
        and becomes its own allow rule. The default ``[]`` keeps the port open to
        every source, and the role now warns about that when ``postgresql_listen_addresses``
        is ``'*'``. Rules are tagged with the ufw comment ``specsnl.specsops.postgresql``,
        so rules for sources dropped from the list are removed. A non-empty list also
        removes the rule open to every source, which earlier releases added. The firewall
        tasks moved to ``tasks/firewall.yml``.
      release_summary: Feature release. ``firewall`` rules can now be limited to a
        source network or an interface, match routed traffic, or delete a rule applied
        earlier. ``postgresql`` can keep its cluster on a separate volume through
        ``postgresql_data_directory`` and limit its firewall rule to given sources
        through ``postgresql_firewall_sources``. The ``specsdeployd`` sudoers drop-in
        now parses under sudo-rs on Ubuntu 26.04.
    fragments:
    - 0.4.0-release-summary.yml
    - firewall-rule-options.yml
    - postgresql-data-directory.yml
    - postgresql-firewall-sources.yml
    - specsdeployd-sudo-rs.yml
    release_date: '2026-10-06'
  0.5.0:
    changes:
      minor_changes:
      - The collection now depends on ``community.postgresql`` (``>=4.0.0,<6.0.0``),
        used by the ``postgresql_apps`` role.
      - 'block_volume - new role that mounts UpCloud block storage volumes, so a VM
        rebuilt from an image mounts the same data again. Each entry in ``block_volume_devices``
        names a ``storage_uuid``, ``label`` and ``mount_point``. The disk is found
        at ``/dev/disk/by-id/virtio-<first 20 characters of the UUID without dashes>``,
        and the role fails when it is not attached. A filesystem (``ext4`` by default)
        is created only when the disk has none, through ``community.general.filesystem``
        with ``force: false``, and an existing filesystem without a label gets one.
        The role refuses a partitioned disk, a filesystem of another type, another
        label, and a label that a second disk also carries. The volume is mounted
        as ``LABEL=<label>`` without ``nofail``, so a missing volume stops the boot
        rather than letting services write to the OS disk. Units in ``required_by``
        get a ``RequiresMountsFor`` drop-in. In containers only the fstab entry and
        the drop-ins are written.'
      - 'postgresql_apps - new role that gives each app on a local PostgreSQL server
        its own login role, a database owned by it, and a ``pg_hba.conf`` line that
        admits only that role, to only that database, from only ``allowed_cidr``.
        ``CONNECT`` on the database is revoked from ``PUBLIC``, so other apps'' roles
        cannot connect either. The lines go in their own marker block, ``specsnl.specsops.postgresql_apps``,
        leaving the ``postgresql`` role''s block alone, and the server is reloaded,
        not restarted, after ``pg_hba_file_rules`` is checked for errors. ``state:
        absent`` removes the line and sets ``NOLOGIN``, but never drops the database.
        Passwords are passed in; the role does no secret lookups.'
      release_summary: Feature release with two new roles. ``block_volume`` mounts
        UpCloud block storage volumes by label, so a VM rebuilt from an image mounts
        the same data again. ``postgresql_apps`` gives each app on a local PostgreSQL
        server its own login role, database and ``pg_hba.conf`` line. The collection
        now depends on ``community.postgresql``.
    fragments:
    - 0.5.0-release-summary.yml
    - block-volume-role.yml
    - postgresql-apps-role.yml
    release_date: '2026-10-08'
