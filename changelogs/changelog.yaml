ancestor: null
releases:
  0.1.0:
    changes:
      major_changes:
      - "Initial release of the ``specsnl.specsops`` collection \u2014 eight roles
        for provisioning and hardening Specs Ubuntu 24.04 (noble) hosts."
      minor_changes:
      - 'base - baseline system setup: apt update/upgrade, core packages, locale,
        timezone and ``sysctl`` tuning. Configures ``needrestart``, ``DPkg::Lock::Timeout``
        and ``force-confdef,force-confold`` so an unattended apt upgrade cannot hang
        on a prompt or fail on a held lock. Optional ``base_prefer_ipv4`` prefers
        IPv4 in ``/etc/gai.conf``.'
      - "cleanup - build-time image cleanup \u2014 apt autoremove/clean and temp directory
        wipe."
      - "firewall - ufw baseline \u2014 default deny incoming, allow outgoing, and
        configurable rules."
      - 'hardening - OS hardening: an sshd drop-in that disables password and keyboard-interactive
        authentication, plus fail2ban. Installs ``openssh-server`` and prepares the
        host keys and ``/run/sshd`` itself, so the role is self-contained on minimal
        images.'
      - logrotate - caps rotated log size and enables compression globally in ``/etc/logrotate.conf``.
      - postgresql - PostgreSQL installation from PGDG with tuning, ``listen_addresses``,
        ``port``, timezone and ``pg_hba.conf`` entries. Only opens a ufw rule when
        the server listens beyond loopback.
      - swap - creates, formats, persists and activates a swap file, and applies the
        related sysctl tuning.
      - unattended_upgrades - automatic security updates via unattended-upgrades and
        chrony, including the periodic download, autoclean and Ubuntu ESM origins.
      release_summary: 'First release of ``specsnl.specsops``. The collection provisions
        and hardens Specs Ubuntu 24.04 (noble) hosts: base system, hardening, firewall,
        unattended upgrades, swap, log rotation, image cleanup and PostgreSQL.'
    release_date: '2026-09-09'
  0.2.0:
    changes:
      breaking_changes:
      - "The collection now targets Ubuntu 26.04 LTS (Resolute Raccoon). Support for
        Ubuntu 24.04 (Noble Numbat) is dropped \u2014 role metadata, Molecule test
        images and documentation all reference 26.04. The roles themselves derive
        the release from facts and carry no hardcoded codename."
      release_summary: Retargets the collection at Ubuntu 26.04 LTS (Resolute Raccoon).
        Ubuntu 24.04 (Noble Numbat) is no longer a supported or tested platform. The
        roles carry no hardcoded codename, so the change is confined to platform metadata,
        the Molecule test image and the documentation.
    fragments:
    - 0.2.0-release-summary.yml
    - ubuntu-2604.yml
    release_date: '2026-09-10'
  0.3.0:
    changes:
      minor_changes:
      - 'ansible_pull - new role that installs the ``ansible`` package, ``/etc/ansible-pull/env``
        and an ``ansible-pull.service`` / ``ansible-pull.timer`` pair. Both ship disabled
        and inert: an empty ``ANSIBLE_PULL_REPO`` makes the service exit 0 with a
        log line instead of running ``ansible-pull``, and the timer is only enabled
        by ``ansible_pull_enabled``. ``ansible_pull_interval`` is validated with ``systemd-analyze
        calendar``, since ``OnCalendar`` takes a calendar event and would otherwise
        park the timer forever on a timespan such as ``30min``.'
      - caddy - new role that adds the official Cloudsmith apt repository, installs
        Caddy, enables the service and optionally opens 80/443 in ufw. It does not
        depend on the ``firewall`` role, so the rules are skipped with a warning when
        ufw is missing rather than aborting the play with Caddy already listening.
        The package's default Caddyfile is left in place.
      - "podman - new role that installs Podman from the Ubuntu ``universe`` repository.
        Resolute ships 5.7.x, which already bundles the Quadlet generator, so no extra
        apt repository is needed. The role ships no unit files and enables neither
        ``podman.socket`` nor ``podman-auto-update.timer`` \u2014 Quadlet-managed
        containers are plain systemd units and need neither."
      - 'specsdeployd - new role that lays down the scaffolding for the ``specsdeployd``
        deploy webhook receiver: a system user, an empty config directory, a two-command
        sudoers drop-in written through ``visudo -cf``, and a systemd unit. The unit
        ships enabled but dormant behind ``ConditionPathExists``, so a golden image
        can carry it without collecting a failed unit on every boot. Installing the
        binary is opt-in via ``specsdeployd_version``, which fetches that release''s
        ``.deb`` and verifies it against the release ``checksums.txt``.'
      release_summary: "Adds the four app-image roles that build on the base host
        roles: ``podman``, ``caddy``, ``specsdeployd`` and ``ansible_pull``. Together
        they cover a Specs golden image that runs containerised applications behind
        Caddy, receives deploys over a webhook and reconciles itself with ansible-pull.
        All four are safe to run at image-build time \u2014 ``specsdeployd`` and ``ansible_pull``
        ship inert, with no binary and no repository configured, so the same playbook
        bakes an image and provisions a live host."
    fragments:
    - 0.3.0-release-summary.yml
    - app-image-roles.yml
    release_date: '2026-09-16'
  0.3.1:
    changes:
      bugfixes:
      - 'cleanup - entries of ``cleanup_paths`` are now left alone when they are mounts
        whose contents never reach the image: a tmpfs anywhere, or any mount when
        running in a container, since ``docker commit`` captures neither tmpfs nor
        volumes. Wiping those saved nothing, and when Ansible runs on the target itself
        (Packer''s ``ansible-local``) it deleted Python''s multiprocessing scratch
        directory from ``/tmp`` mid-run, so the build ended in a ``FileNotFoundError``
        traceback. A path on its own disk partition on a VM is still wiped. ``cleanup_skip_ephemeral:
        false`` restores the old behaviour.'
      release_summary: Bugfix release. The ``cleanup`` role no longer wipes ``cleanup_paths``
        entries whose contents never reach the image, which broke Packer ``ansible-local``
        builds by deleting Python's multiprocessing scratch directory from ``/tmp``
        mid-run.
    fragments:
    - 0.3.1-release-summary.yml
    - cleanup-skip-ephemeral-mounts.yml
    release_date: '2026-09-25'
