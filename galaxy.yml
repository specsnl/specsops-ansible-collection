---
namespace: specsnl
name: specsops
version: 0.4.0
readme: README.md
authors:
  - Ilyes Ahidar <ilyes@specs.nl>
description: >-
  Ansible roles for provisioning and hardening Specs Ubuntu 26.04 hosts:
  base system, hardening, firewall, unattended upgrades, swap, log rotation,
  PostgreSQL and a per-app PostgreSQL role and database, Podman, Caddy, the
  specsdeployd deploy receiver, ansible-pull, a cloud-init default login user
  for images, and block storage volumes mounted by label.
license:
  - MIT
tags:
  - specsnl
  - specsops
  - ubuntu
  - resolute
  - hardening
  - postgresql
  - firewall
  - swap
  - logrotate
  - infrastructure
  - linux
  - security
  - database
  - podman
  - containers
  - caddy
  - webserver
  - deployment
  - cloudinit
  - storage
dependencies:
  community.general: ">=8.0.0,<14.0.0"
  ansible.posix: ">=1.5.0,<3.0.0"
  community.postgresql: ">=4.0.0,<6.0.0"
repository: https://github.com/specsnl/specsops-ansible-collection
documentation: https://github.com/specsnl/specsops-ansible-collection
homepage: https://github.com/specsnl/specsops-ansible-collection
issues: https://github.com/specsnl/specsops-ansible-collection/issues
build_ignore:
  - .github
  - .gitignore
  - .editorconfig
  - .yamllint
  - .ansible-lint
  - .markdownlint-cli2.yaml
  - Taskfile.dist.yml
  - Taskfile.yml
  - requirements.yml
  - ansible.cfg
  - molecule
  - roles/*/molecule
  - changelogs/fragments
  - changelogs/config.yaml
  - changelogs/.plugin-cache.yaml
  - dist
  - "*.tar.gz"
  - plans
  - collections
  - .ansible
  - .DS_Store
  - compose.yml
