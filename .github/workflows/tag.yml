name: Tags

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish to Ansible Galaxy
    runs-on: ubuntu-24.04
    container: ghcr.io/specsnl/ansible:1.14.0
    env:
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Assert preconditions
        run: |
          FAILED=0
          if [ -z "$GALAXY_API_KEY" ]; then
            echo "::error::GALAXY_API_KEY is not set"
            FAILED=1
          fi
          GALAXY_VERSION="$(grep '^version:' galaxy.yml | awk '{print $2}')"
          if [ "$GALAXY_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match galaxy.yml version $GALAXY_VERSION"
            FAILED=1
          fi
          exit "$FAILED"
      - name: Build collection
        run: ansible-galaxy collection build --output-path ./dist
      - name: Publish to Ansible Galaxy
        run: |
          ansible-galaxy collection publish "./dist/specsnl-specsops-${TAG}.tar.gz" \
            --api-key "$GALAXY_API_KEY"
