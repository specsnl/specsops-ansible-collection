name: Tags

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish to Ansible Galaxy
    runs-on: ubuntu-24.04
    container: ghcr.io/specsnl/ansible:1.14.0
    env:
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches galaxy.yml version
        run: |
          GALAXY_VERSION="$(grep '^version:' galaxy.yml | awk '{print $2}')"
          if [ "$GALAXY_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match galaxy.yml version $GALAXY_VERSION"
            exit 1
          fi
      - name: Build collection
        run: ansible-galaxy collection build --output-path ./dist
      - name: Publish to Ansible Galaxy
        if: env.GALAXY_API_KEY != ''
        run: |
          ansible-galaxy collection publish "./dist/specsnl-specsops-${TAG}.tar.gz" \
            --api-key "$GALAXY_API_KEY"
      - name: Skip publish
        if: env.GALAXY_API_KEY == ''
        run: |
          echo "::notice::GALAXY_API_KEY is not set - built the tarball but skipped publishing."
