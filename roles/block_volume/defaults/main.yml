---
# Volumes to format-if-empty and mount by label. Each entry:
#   storage_uuid  UpCloud storage UUID of the attached disk (required)
#   label         filesystem label, mounted as LABEL=<label> (required)
#   mount_point   absolute path to mount it on (required)
#   fstype        ext4 (default), ext3, ext2 or xfs
#   mount_opts    defaults to block_volume_mount_opts
#   owner, group, mode  of the mounted filesystem's root, left alone when unset
#   required_by   systemd units that only start with the volume mounted
#
# UpCloud passes the storage UUID to the guest as the virtio-blk serial. virtio-blk
# serials are capped at 20 bytes, so udev links the disk as
# /dev/disk/by-id/virtio-<first 20 characters of the UUID without dashes>:
#   storage_uuid 01d4fcd4-e446-433b-8a9c-551a1284952e
#   by-id link   /dev/disk/by-id/virtio-01d4fcd4e446433b8a9c
# This is the mapping UpCloud's own CSI driver relies on (volumeIDToDiskID in
# UpCloudLtd/upcloud-csi). It needs the disk on the virtio bus, which is UpCloud's
# default; a disk attached as ide or scsi has no such link and the role fails.
block_volume_devices: []

block_volume_fstype: ext4
block_volume_mount_opts: defaults,noatime
