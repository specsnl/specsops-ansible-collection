---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible@sha256:1aa37801b2496b234dc46f1965b4499ebfaf06ad3c585006bd0a5f326a71abe3
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  config_options:
    defaults:
      # Lets become_user postgres work without acl on the target.
      pipelining: true
  inventory:
    group_vars:
      all:
        molecule_app_passwords:
          app_one: app-one-secret
          app_two: app-two-secret
        # The container's own address, so the apps connect over a network that
        # Debian's loopback rules in pg_hba.conf do not cover.
        molecule_app_cidr: "{{ ansible_facts['default_ipv4']['address'] }}/32"
        postgresql_apps:
          - name: app_one
            password: "{{ molecule_app_passwords.app_one }}"
            allowed_cidr: "{{ molecule_app_cidr }}"
          - name: app_two
            password: "{{ molecule_app_passwords.app_two }}"
            database: app_two_db
            allowed_cidr: "{{ molecule_app_cidr }}"
          - name: app_retired
            state: absent

verifier:
  name: ansible

scenario:
  test_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    # - side_effect
    - verify
    # - cleanup
    - destroy
  converge_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    - create
    - prepare
    - converge
  destroy_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
