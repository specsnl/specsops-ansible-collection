---
argument_specs:
  main:
    short_description: Build-time image cleanup
    description: Runs apt autoremove and clean, then wipes the contents of temp directories. Intended for use at the end of Packer image builds.
    options:
      cleanup_paths:
        type: list
        elements: str
        description: List of directories whose contents will be deleted.
      cleanup_skip_ephemeral:
        type: bool
        default: true
        description: >-
          Leave entries of cleanup_paths untouched when they are mounts whose contents
          never reach the image: a tmpfs anywhere, or any mount when running in a
          container. Wiping those saves nothing, and deletes the running interpreter's
          scratch files when Ansible runs on the target itself.
