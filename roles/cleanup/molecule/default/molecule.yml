---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible@sha256:1aa37801b2496b234dc46f1965b4499ebfaf06ad3c585006bd0a5f326a71abe3
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  config_options:
    defaults:
      pipelining: true

verifier:
  name: ansible

scenario:
  test_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    # - side_effect
    - verify
    # - cleanup
    - destroy
  converge_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    - create
    # - prepare
    - converge
  destroy_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
