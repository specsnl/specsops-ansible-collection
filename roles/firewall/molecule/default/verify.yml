---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert ufw is installed
      ansible.builtin.assert:
        that: "'ufw' in ansible_facts.packages"
        fail_msg: "ufw is not installed"

    - name: Check ufw status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Read ufw defaults configuration
      ansible.builtin.slurp:
        src: /etc/default/ufw
      register: ufw_defaults_raw

    - name: Assert ufw default deny incoming is configured
      ansible.builtin.assert:
        that: >-
          ('Default: deny (incoming)' in ufw_status.stdout) or
          ('DEFAULT_INPUT_POLICY="DROP"' in (ufw_defaults_raw.content | b64decode))
        fail_msg: "ufw default incoming is not set to deny"

    - name: Check ufw added rules
      ansible.builtin.command: ufw show added
      register: ufw_added_rules
      changed_when: false

    - name: Assert SSH rule is present
      ansible.builtin.assert:
        that: >-
          ('22/tcp' in ufw_status.stdout or '22 ' in ufw_status.stdout) or
          ('22/tcp' in ufw_added_rules.stdout or '22 ' in ufw_added_rules.stdout)
        fail_msg: "SSH rule (port 22) not found in ufw rules"

    # ufw show added reads the rule files, so it works with ufw left disabled in a container
    - name: Assert the source-limited, interface and route rules are present
      ansible.builtin.assert:
        that: item in ufw_added_rules.stdout_lines
        fail_msg: "Missing ufw rule: {{ item }}"
      loop:
        - "ufw allow from 10.20.0.16/28 to any port 5432 proto tcp comment 'app range'"
        - ufw allow in on wg0 to any port 22 proto tcp
        - ufw route allow in on wg0 out on eth1 to 10.20.0.0/24

    - name: Assert the deleted bootstrap rule is gone
      ansible.builtin.assert:
        that: ufw_added_rules.stdout is not search('2222')
        fail_msg: "Rule for port 2222 should have been deleted"
