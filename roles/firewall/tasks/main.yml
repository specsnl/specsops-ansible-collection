---
- name: Detect container environment
  ansible.builtin.set_fact:
    firewall_in_container: >-
      {{ (ansible_facts['virtualization_type'] | default('') in
          ['docker', 'container', 'containerd', 'podman', 'lxc'])
         or (lookup('ansible.builtin.fileglob', '/.dockerenv') | length > 0) }}
  when: firewall_in_container is not defined

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set ufw default incoming policy
  community.general.ufw:
    direction: incoming
    default: "{{ firewall_default_incoming }}"

- name: Set ufw default outgoing policy
  community.general.ufw:
    direction: outgoing
    default: "{{ firewall_default_outgoing }}"

- name: Apply firewall rules
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
  loop: "{{ firewall_rules + firewall_extra_rules }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: not firewall_in_container
