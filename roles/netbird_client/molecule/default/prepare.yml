---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    # Stand-in for what converge must clean up: a rule for a port since changed.
    - name: Seed stale NetBird port rule
      community.general.ufw:
        rule: allow
        port: "51821"
        proto: udp
        comment: specsnl.specsops.netbird_client

    # And one this role does not own, which it must leave alone.
    - name: Seed foreign port rule
      community.general.ufw:
        rule: allow
        port: "51830"
        proto: udp
