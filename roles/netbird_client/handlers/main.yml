---
- name: Restart netbird
  ansible.builtin.systemd_service:
    name: netbird
    daemon_reload: true
    state: restarted
  when: netbird_client_enrol | bool
  listen: netbird unit changed

# An unenrolled client stays stopped; systemd only has to see the new drop-in.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not (netbird_client_enrol | bool)
  listen: netbird unit changed
