---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

# Two hosts, because the role has two shipping states and only one of them is the
# default: a binary-free image whose unit stays dormant, and a host that was given
# specsdeployd_version at runtime.
platforms:
  - name: ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible@sha256:1aa37801b2496b234dc46f1965b4499ebfaf06ad3c585006bd0a5f326a71abe3
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
  - name: ubuntu2604-installed
    image: geerlingguy/docker-ubuntu2604-ansible@sha256:1aa37801b2496b234dc46f1965b4499ebfaf06ad3c585006bd0a5f326a71abe3
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  inventory:
    host_vars:
      ubuntu2604-installed:
        specsdeployd_version: "0.1.0"

verifier:
  name: ansible

scenario:
  test_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
    - syntax
    - create
    # - prepare
    - converge
    - idempotence
    # - side_effect
    - verify
    # - cleanup
    - destroy
  converge_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    - create
    # - prepare
    - converge
  destroy_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
