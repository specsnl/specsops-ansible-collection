---
# This role does not depend on the firewall role, so ufw may simply not be here.
- name: Check whether ufw is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: netbird_server_ufw
  when: netbird_server_manage_firewall | bool

- name: Warn that the STUN port was left closed
  ansible.builtin.debug:
    msg: >-
      WARNING: ufw is not installed, so {{ netbird_server_stun_port }}/udp was not opened
      and peers cannot reach STUN. Run the specsnl.specsops.firewall role first, or set
      netbird_server_manage_firewall to false and manage the rules yourself.
  when:
    - netbird_server_manage_firewall | bool
    - not netbird_server_ufw.stat.exists

# A changed port would otherwise leave its rules active. Only rules carrying this
# role's comment are considered, so rules added by hand or by the firewall role
# are left alone.
- name: Read the added ufw rules
  ansible.builtin.command: ufw show added
  register: netbird_server_ufw_added
  changed_when: false
  check_mode: false
  when:
    - netbird_server_manage_firewall | bool
    - netbird_server_ufw.stat.exists

- name: Find stale STUN rules
  ansible.builtin.set_fact:
    netbird_server_firewall_stale_rules: >-
      {%- set stale = [] -%}
      {%- for line in netbird_server_ufw_added.stdout_lines -%}
      {%-   set match = line | regex_search(netbird_server_firewall_port_regexp, '\\1') -%}
      {%-   if match and match[0] != netbird_server_stun_port | string -%}
      {%-     set _ = stale.append({'port': match[0], 'route': line.startswith('ufw route ')}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ stale }}
  when:
    - netbird_server_manage_firewall | bool
    - netbird_server_ufw.stat.exists

- name: Remove STUN rules for an old port
  community.general.ufw:
    rule: allow
    route: "{{ item.route }}"
    port: "{{ item.port }}"
    proto: udp
    delete: true
  loop: "{{ netbird_server_firewall_stale_rules }}"
  when:
    - netbird_server_manage_firewall | bool
    - netbird_server_ufw.stat.exists

- name: Allow the STUN port through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ netbird_server_stun_port | string }}"
    proto: udp
    comment: "{{ netbird_server_firewall_comment }}"
  when:
    - netbird_server_manage_firewall | bool
    - netbird_server_ufw.stat.exists

# The published port is DNATed into the container, so the packets are forwarded,
# and ufw drops forwarded traffic by default.
- name: Route the STUN port to the container
  community.general.ufw:
    rule: allow
    route: true
    port: "{{ netbird_server_stun_port | string }}"
    proto: udp
    comment: "{{ netbird_server_firewall_comment }}"
  when:
    - netbird_server_manage_firewall | bool
    - netbird_server_ufw.stat.exists
