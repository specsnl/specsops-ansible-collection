---
base_packages:
  - curl
  - git
  - jq
  - gnupg
  - ca-certificates
  - locales

base_apt_upgrade: dist
base_apt_cache_valid_time: 3600

base_locale: en_US.UTF-8
base_lang: en_US.UTF-8
base_timezone: UTC

base_sysctl_file: /etc/sysctl.d/99-base.conf
base_sysctl:
  vm.swappiness: "10"
  fs.file-max: "200000"
