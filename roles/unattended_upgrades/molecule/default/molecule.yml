---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  inventory:
    host_vars:
      ubuntu2404:
        unattended_upgrades_in_container: true

verifier:
  name: ansible

scenario:
  test_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
    - syntax
    - create
    # - prepare
    - converge
    - idempotence
    # - side_effect
    - verify
    # - cleanup
    - destroy
  converge_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    - create
    # - prepare
    - converge
  destroy_sequence:
    # - dependency  # handled by Taskfile before molecule runs
    # - cleanup
    - destroy
