---
# pocket_id_version (the image tag, e.g. v2.19.1), pocket_id_app_url (e.g.
# https://id.example.com) and pocket_id_encryption_key have no default.

pocket_id_image: ghcr.io/pocket-id/pocket-id

# On the data disk. The role fails when it would land on the root filesystem.
pocket_id_data_dir: /srv/pocket-id
pocket_id_data_dir_require_mount: true

# Published on 127.0.0.1 only; Caddy proxies to it.
pocket_id_port: 1411

# The container's entrypoint drops to this user's uid and gid, which own the data
# directory and the key file.
pocket_id_user: pocket-id

pocket_id_caddy_sites_dir: /etc/caddy/sites
