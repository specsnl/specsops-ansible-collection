---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    # Stand-ins for what converge must clean up: a rule for a port since changed
    # and one for a network since dropped from wireguard_forward_cidrs.
    - name: Seed stale WireGuard port rule
      community.general.ufw:
        rule: allow
        port: "51821"
        proto: udp
        comment: specsnl.specsops.wireguard

    - name: Seed stale WireGuard route rule
      community.general.ufw:
        rule: allow
        route: true
        interface_in: wg0
        to_ip: 10.99.0.0/24
        comment: specsnl.specsops.wireguard

    # And one this role does not own, which it must leave alone.
    - name: Seed foreign route rule
      community.general.ufw:
        rule: allow
        route: true
        interface_in: wg0
        to_ip: 10.98.0.0/24
