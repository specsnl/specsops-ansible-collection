---
# Deliberately does not install or start openssh-server: the role owns that, and
# doing it here would hide a regression that breaks every minimal-image build.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Ensure sshd_config.d directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Ubuntu cloud images ship this file. sshd's Include is first-match-wins, so
    # it is what a too-highly-numbered hardening drop-in silently loses to.
    - name: Reproduce the cloud-init sshd drop-in
      ansible.builtin.copy:
        content: |
          # Created by cloud-init
          PasswordAuthentication yes
        dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
        owner: root
        group: root
        mode: "0644"
