---
argument_specs:
  main:
    short_description: OS hardening
    description: >-
      Installs openssh-server, deploys an sshd drop-in configuration and installs
      fail2ban.
    options:
      hardening_ssh_dropin_path:
        type: str
        default: /etc/ssh/sshd_config.d/00-hardening.conf
        description: >-
          Path to the sshd configuration drop-in file. Numbered 00- because sshd's
          Include is first-obtained-value-wins and Ubuntu cloud images ship a
          50-cloud-init.conf that enables password authentication.
      hardening_ssh_permit_root_login:
        type: str
        default: "no"
        description: Value for PermitRootLogin in sshd config.
      hardening_ssh_password_authentication:
        type: str
        default: "no"
        description: Value for PasswordAuthentication in sshd config.
      hardening_ssh_kbd_interactive_authentication:
        type: str
        default: "no"
        description: >-
          Value for KbdInteractiveAuthentication in sshd config. Must also be "no",
          otherwise password login remains reachable via PAM keyboard-interactive.
      hardening_ssh_max_auth_tries:
        type: int
        default: 3
        description: Value for MaxAuthTries in sshd config.
      hardening_fail2ban_enabled:
        type: bool
        default: true
        description: Whether to install and enable fail2ban.
      hardening_ssh_manage_package:
        type: bool
        default: true
        description: >-
          Whether to install openssh-server. The role validates its drop-in with
          `sshd -t`, which needs the binary present. Set to false only when the
          package is managed elsewhere and already installed.
