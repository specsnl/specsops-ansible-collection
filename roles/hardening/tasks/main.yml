---
# stat, not a fileglob lookup: lookups run on the controller, which is itself a
# container here, and would mark every target — real VMs included — as one.
- name: Stat container marker files
  ansible.builtin.stat:
    path: "{{ item }}"
  register: hardening_container_markers
  loop:
    - /.dockerenv
    - /run/.containerenv
  when: hardening_in_container is not defined

- name: Detect container environment
  ansible.builtin.set_fact:
    hardening_in_container: >-
      {{ (ansible_facts['virtualization_type'] | default('') in
          ['docker', 'container', 'containerd', 'podman', 'lxc'])
         or (hardening_container_markers.results
             | selectattr('stat.exists') | list | length > 0) }}
  when: hardening_in_container is not defined

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: hardening_fail2ban_enabled

- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: hardening_ssh_manage_package

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# `sshd -t` loads the host keys and stats the privsep dir, so both must exist
# before the drop-in below can be validated on a host that never booted sshd.
- name: Ensure sshd host keys exist
  ansible.builtin.command: ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ hardening_ssh_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

# Hosts provisioned before the 00- rename still carry the inert 99- drop-in.
# Skipped when the operator has explicitly pinned the old path.
- name: Remove superseded 99-hardening.conf drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent
  when: hardening_ssh_dropin_path != '/etc/ssh/sshd_config.d/99-hardening.conf'
  notify: Restart sshd

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: "{{ 'started' if not hardening_in_container else omit }}"
  when: hardening_fail2ban_enabled
