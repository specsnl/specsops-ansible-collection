---
argument_specs:
  main:
    short_description: PostgreSQL installation from PGDG
    description: >-
      Adds the PGDG apt repository, installs PostgreSQL, optionally moves the cluster to a
      configured data directory, deploys a tuning config, enables the service, and
      optionally opens the port in ufw.
    options:
      postgresql_version:
        type: int
        default: 18
        description: PostgreSQL major version to install.
      postgresql_port:
        type: int
        default: 5432
        description: PostgreSQL port — used when opening the firewall rule.
      postgresql_pgdg_key_url:
        type: str
        description: URL to the PGDG GPG signing key (.asc).
      postgresql_listen_addresses:
        type: str
        default: localhost
        description: >-
          Value for listen_addresses. Loopback-only by default; the firewall rule is
          gated on this so the port is not opened for a server nothing can reach.
      postgresql_timezone:
        type: str
        default: UTC
        description: Value for both timezone and log_timezone.
      postgresql_data_directory:
        type: str
        default: ""
        description: >-
          Absolute path to keep the cluster's data in, e.g. a subdirectory of a mounted
          volume. Empty keeps the Debian default /var/lib/postgresql/<version>/main. The
          parent must already exist. An empty or missing target gets the default cluster
          copied in; one holding PG_VERSION is adopted as-is, and the role fails when that
          is another major version. A non-empty target without PG_VERSION is never touched:
          the role fails instead.
      postgresql_manage_firewall:
        type: bool
        default: true
        description: >-
          When true, opens postgresql_port/tcp in ufw. Skipped in containers, when
          postgresql_listen_addresses is loopback-only, and when ufw is not
          installed — the last case logs a warning instead of failing.
      postgresql_firewall_sources:
        type: list
        elements: dict
        default: []
        description: >-
          Sources allowed to reach postgresql_port/tcp, each becoming its own ufw
          allow rule. Empty opens the port to every source, with a warning when
          postgresql_listen_addresses is '*'. Rules for sources dropped from the
          list are removed, and so is the rule open to every source once the list
          is non-empty.
        options:
          from_ip:
            type: str
            description: >-
              Source address or network, e.g. 10.20.0.16/28. Give the network
              address, as ufw normalises the rest. Any source when omitted.
          interface:
            type: str
            description: Incoming interface the rule is limited to. Any interface when omitted.
      postgresql_hba_entries:
        type: list
        elements: dict
        default: []
        description: >-
          pg_hba.conf entries appended inside an Ansible-managed marker block. Keys:
          type, database, user, address (optional for local), method. Empty by default,
          leaving the distribution's rules untouched.
      postgresql_tuning:
        type: dict
        description: >-
          Map of postgresql.conf parameter names to values written to tuning.conf.
          listen_addresses, port, timezone and log_timezone have dedicated variables
          and are rendered separately.
