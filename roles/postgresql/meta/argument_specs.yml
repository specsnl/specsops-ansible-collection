---
argument_specs:
  main:
    short_description: PostgreSQL installation from PGDG
    description: Adds the PGDG apt repository, installs PostgreSQL, deploys a tuning config, enables the service, and optionally opens the port in ufw.
    options:
      postgresql_version:
        type: int
        default: 18
        description: PostgreSQL major version to install.
      postgresql_port:
        type: int
        default: 5432
        description: PostgreSQL port — used when opening the firewall rule.
      postgresql_pgdg_key_url:
        type: str
        description: URL to the PGDG GPG signing key (.asc).
      postgresql_keyring_path:
        type: str
        description: Destination path for the dearmored GPG keyring (unused with deb822_repository).
      postgresql_manage_firewall:
        type: bool
        default: true
        description: When true, opens postgresql_port/tcp in ufw (skipped in containers).
      postgresql_tuning:
        type: dict
        description: Map of postgresql.conf parameter names to values written to tuning.conf.
